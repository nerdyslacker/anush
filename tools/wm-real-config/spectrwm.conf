workspace_limit = 9
modkey = Mod4
bar_enabled = 0
focus_mode = manual
tile_gap = 8
border_width = 2
program[term] = xterm
program[anush_launcher] = anushctl launcher toggle
program[anush_clipboard] = anushctl clipboard toggle
program[anush_notes] = anushctl notes toggle
bind[term] = MOD+Return
bind[anush_launcher] = MOD+a
bind[anush_clipboard] = MOD+v
bind[anush_notes] = MOD+Shift+n
bind[layout_vertical] = MOD+F5
bind[layout_horizontal] = MOD+F6
bind[layout_max] = MOD+F7
bind[layout_floating] = MOD+F8
quirk[AnushSmokeFloat:*] = FLOAT
