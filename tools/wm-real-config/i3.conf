font pango:monospace 9
focus_follows_mouse no
default_border pixel 2
default_floating_border pixel 2
gaps inner 8
set $mod Mod4
for_window [class="^AnushSmokeFloat$"] floating enable
bindsym $mod+Return exec xterm
bindsym $mod+a exec --no-startup-id anushctl launcher toggle
bindsym $mod+v exec --no-startup-id anushctl clipboard toggle
bindsym $mod+Shift+n exec --no-startup-id anushctl notes toggle
bindsym $mod+1 workspace 1
bindsym $mod+2 workspace 2
bindsym $mod+3 workspace 3
bindsym $mod+4 workspace 4
bindsym $mod+5 workspace 5
bindsym $mod+6 workspace 6
bindsym $mod+7 workspace 7
bindsym $mod+8 workspace 8
bindsym $mod+9 workspace 9
